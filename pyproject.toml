[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shot-form-coach"
version = "0.7.0"
description = "Local basketball shooting review with traceable phase corrections and visual reports"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.4",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18",
  "python-dotenv>=1,<2",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "av==19.0.1",
  "Pillow>=10,<13",
  "numpy>=2,<3",
  "mediapipe==1.1.0",
  "opencv-contrib-python==5.0.0.93",
  "google-genai==2.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
